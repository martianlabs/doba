services:
  http11probe:
    build:
      context: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./out/http11probe:/results
    command:
      - --host
      - "${DOBA_HOST:-host.docker.internal}"
      - --port
      - "${DOBA_PORT:-8080}"
      - --output
      - /results/results.json
