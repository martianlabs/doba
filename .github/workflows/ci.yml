name: Build & Test

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: Create the GitHub Release after all jobs pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            compiler: g++
            build_type: Debug
            build_dir: out/build/gcc-debug
            tls: "OFF"
          - name: GCC Release
            compiler: g++
            build_type: Release
            build_dir: out/build/gcc-release
            tls: "ON"
          - name: Clang Debug
            compiler: clang++
            build_type: Debug
            build_dir: out/build/clang-debug
            tls: "OFF"
          - name: Clang Release
            compiler: clang++
            build_type: Release
            build_dir: out/build/clang-release
            tls: "OFF"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install OpenSSL
        if: matrix.tls == 'ON'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure
        run: >-
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DDOBA_ENABLE_STRICT_WARNINGS=ON
          -DDOBA_ENABLE_TLS=${{ matrix.tls }}

      - name: Build
        run: cmake --build ${{ matrix.build_dir }}

      - name: Verify test inventory
        if: matrix.build_type == 'Release'
        run: >-
          cmake -DDOBA_CI_BUILD_DIR=${{ matrix.build_dir }}
          -DDOBA_CI_REQUIRE_TLS=${{ matrix.tls }}
          -P cmake/ci_test_inventory.cmake

      - name: Run Release tests
        if: matrix.build_type == 'Release'
        run: >-
          ctest --test-dir ${{ matrix.build_dir }}
          --output-on-failure --no-tests=error

      - name: Install
        if: matrix.name == 'GCC Release'
        run: >-
          cmake --install ${{ matrix.build_dir }}
          --prefix out/install/gcc-release

      - name: Configure package consumer (Debug)
        if: matrix.name == 'GCC Release'
        run: >-
          cmake -S tests/package -B out/build/package-consumer-debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/install/gcc-release
          -DDOBA_PACKAGE_USE_TLS=ON

      - name: Build package consumer (Debug)
        if: matrix.name == 'GCC Release'
        run: cmake --build out/build/package-consumer-debug

      - name: Configure package consumer (Release)
        if: matrix.name == 'GCC Release'
        run: >-
          cmake -S tests/package -B out/build/package-consumer-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/install/gcc-release
          -DDOBA_PACKAGE_USE_TLS=ON

      - name: Build package consumer (Release)
        if: matrix.name == 'GCC Release'
        run: cmake --build out/build/package-consumer-release

      - name: Run package TLS consumer (Release)
        if: matrix.name == 'GCC Release'
        run: out/build/package-consumer-release/doba_package_tls_consumer

      - name: Configure add_subdirectory consumer
        if: matrix.name == 'GCC Release'
        run: >-
          cmake -S tests/package -B out/build/add-subdirectory-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DDOBA_PACKAGE_USE_SOURCE=ON
          -DDOBA_SOURCE_DIR=${{ github.workspace }}
          -DDOBA_ENABLE_TLS=ON
          -DDOBA_PACKAGE_USE_TLS=ON

      - name: Build add_subdirectory consumer
        if: matrix.name == 'GCC Release'
        run: cmake --build out/build/add-subdirectory-consumer

      - name: Run add_subdirectory TLS consumer
        if: matrix.name == 'GCC Release'
        run: >-
          out/build/add-subdirectory-consumer/doba_package_tls_consumer

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ matrix.build_dir }}/CMakeFiles/*/CMakeCXXCompiler.cmake
            ${{ matrix.build_dir }}/compile_commands.json
            ${{ matrix.build_dir }}/ci-evidence/
            ${{ matrix.build_dir }}/Testing/Temporary/
          retention-days: 14

  windows:
    name: Windows (MSVC ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            configure_preset: msvc-debug
            build_preset: build-debug
            build_dir: out/build/msvc-debug
            tls: "OFF"
          - build_type: Release
            configure_preset: msvc-release
            build_preset: build-release
            build_dir: out/build/msvc-release
            tls: "ON"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Read vcpkg revision
        if: matrix.tls == 'ON'
        id: vcpkg-revision
        run: echo "revision=$(git -C C:/vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        if: matrix.tls == 'ON'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-openssl-x64-windows-${{ steps.vcpkg-revision.outputs.revision }}

      - name: Install OpenSSL
        if: matrix.tls == 'ON'
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
        run: vcpkg install openssl:x64-windows

      - name: Configure
        if: matrix.tls == 'OFF'
        run: >-
          cmake --preset ${{ matrix.configure_preset }}
          -DDOBA_ENABLE_STRICT_WARNINGS=ON

      - name: Configure TLS
        if: matrix.tls == 'ON'
        run: >-
          cmake --preset ${{ matrix.configure_preset }}
          -DDOBA_ENABLE_STRICT_WARNINGS=ON
          -DDOBA_ENABLE_TLS=ON
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Verify test inventory
        if: matrix.build_type == 'Release'
        run: >-
          cmake -DDOBA_CI_BUILD_DIR=${{ matrix.build_dir }}
          -DDOBA_CI_REQUIRE_TLS=${{ matrix.tls }}
          -P cmake/ci_test_inventory.cmake

      - name: Run Release tests
        if: matrix.build_type == 'Release'
        run: >-
          ctest --test-dir ${{ matrix.build_dir }}
          --output-on-failure --no-tests=error

      - name: Install TLS package
        if: matrix.tls == 'ON'
        run: >-
          cmake --install ${{ matrix.build_dir }}
          --prefix out/install/msvc-release

      - name: Configure package TLS consumer
        if: matrix.tls == 'ON'
        run: >-
          cmake -S tests/package -B out/build/package-consumer-tls -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/out/install/msvc-release"
          -DDOBA_PACKAGE_USE_TLS=ON

      - name: Build package TLS consumer
        if: matrix.tls == 'ON'
        run: cmake --build out/build/package-consumer-tls

      - name: Run package TLS consumer
        if: matrix.tls == 'ON'
        run: out/build/package-consumer-tls/doba_package_tls_consumer.exe

      - name: Configure add_subdirectory TLS consumer
        if: matrix.tls == 'ON'
        run: >-
          cmake -S tests/package -B out/build/add-subdirectory-tls -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DDOBA_PACKAGE_USE_SOURCE=ON
          -DDOBA_SOURCE_DIR="${{ github.workspace }}"
          -DDOBA_ENABLE_TLS=ON
          -DDOBA_PACKAGE_USE_TLS=ON

      - name: Build add_subdirectory TLS consumer
        if: matrix.tls == 'ON'
        run: cmake --build out/build/add-subdirectory-tls

      - name: Run add_subdirectory TLS consumer
        if: matrix.tls == 'ON'
        run: >-
          out/build/add-subdirectory-tls/doba_package_tls_consumer.exe

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.build_type }}
          path: |
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ matrix.build_dir }}/CMakeFiles/*/CMakeCXXCompiler.cmake
            ${{ matrix.build_dir }}/compile_commands.json
            ${{ matrix.build_dir }}/ci-evidence/
            ${{ matrix.build_dir }}/Testing/Temporary/
          retention-days: 14

  sanitizer:
    name: Ubuntu (${{ matrix.name }} Release TLS)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            sanitizer: address
            build_dir: out/build/asan
          - name: UBSan
            sanitizer: undefined
            build_dir: out/build/ubsan
          - name: TSan
            sanitizer: thread
            build_dir: out/build/tsan

    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install OpenSSL and symbolizer
        run: sudo apt-get update && sudo apt-get install -y libssl-dev llvm

      - name: Configure
        run: >-
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DDOBA_ENABLE_STRICT_WARNINGS=ON
          -DDOBA_ENABLE_TLS=ON
          "-DCMAKE_CXX_FLAGS=-g -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build ${{ matrix.build_dir }}

      - name: Verify test inventory
        run: >-
          cmake -DDOBA_CI_BUILD_DIR=${{ matrix.build_dir }}
          -DDOBA_CI_REQUIRE_TLS=ON -P cmake/ci_test_inventory.cmake

      - name: Test
        run: >-
          ctest --test-dir ${{ matrix.build_dir }}
          --output-on-failure --no-tests=error

      - name: Repeat critical interleavings under TSan
        if: matrix.sanitizer == 'thread'
        run: >-
          ctest --test-dir ${{ matrix.build_dir }}
          -R '^doba_engine_concurrency_tests$'
          --repeat until-fail:200 --output-on-failure --no-tests=error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}-Release-TLS
          path: |
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ matrix.build_dir }}/CMakeFiles/*/CMakeCXXCompiler.cmake
            ${{ matrix.build_dir }}/compile_commands.json
            ${{ matrix.build_dir }}/ci-evidence/
            ${{ matrix.build_dir }}/Testing/Temporary/
          retention-days: 14

  windows-asan:
    name: Windows (MSVC ASan Release TLS)
    runs-on: windows-latest

    env:
      ASAN_OPTIONS: halt_on_error=1

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Read vcpkg revision
        id: vcpkg-revision
        run: echo "revision=$(git -C C:/vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-openssl-x64-windows-${{ steps.vcpkg-revision.outputs.revision }}

      - name: Install OpenSSL
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
        run: vcpkg install openssl:x64-windows

      - name: Configure
        run: >-
          cmake -S . -B out/build/msvc-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DDOBA_ENABLE_STRICT_WARNINGS=ON
          -DDOBA_ENABLE_TLS=ON
          "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /fsanitize=address /Zi"
          "-DCMAKE_EXE_LINKER_FLAGS=/INCREMENTAL:NO /DEBUG"

      - name: Build
        run: cmake --build out/build/msvc-asan

      - name: Verify test inventory
        run: >-
          cmake -DDOBA_CI_BUILD_DIR=out/build/msvc-asan
          -DDOBA_CI_REQUIRE_TLS=ON -P cmake/ci_test_inventory.cmake

      - name: Test
        run: >-
          ctest --test-dir out/build/msvc-asan
          --output-on-failure --no-tests=error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ASan-Release-TLS
          path: |
            out/build/msvc-asan/CMakeCache.txt
            out/build/msvc-asan/CMakeFiles/CMakeConfigureLog.yaml
            out/build/msvc-asan/CMakeFiles/*/CMakeCXXCompiler.cmake
            out/build/msvc-asan/compile_commands.json
            out/build/msvc-asan/ci-evidence/
            out/build/msvc-asan/Testing/Temporary/
            out/build/msvc-asan/**/*.pdb
          retention-days: 14

  cmake-minimum:
    name: Ubuntu (CMake 3.20.6)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.20.6"

      - name: Configure
        run: >-
          cmake -S . -B out/build/cmake-3.20 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DDOBA_ENABLE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build out/build/cmake-3.20

      - name: Verify test inventory
        run: >-
          cmake -DDOBA_CI_BUILD_DIR=out/build/cmake-3.20
          -DDOBA_CI_REQUIRE_TLS=OFF -P cmake/ci_test_inventory.cmake

      - name: Test
        run: >-
          ctest --test-dir out/build/cmake-3.20
          --output-on-failure --no-tests=error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cmake-minimum-Release
          path: |
            out/build/cmake-3.20/CMakeCache.txt
            out/build/cmake-3.20/CMakeFiles/CMakeOutput.log
            out/build/cmake-3.20/CMakeFiles/CMakeError.log
            out/build/cmake-3.20/CMakeFiles/*/CMakeCXXCompiler.cmake
            out/build/cmake-3.20/compile_commands.json
            out/build/cmake-3.20/ci-evidence/
            out/build/cmake-3.20/Testing/Temporary/
          retention-days: 14

  release:
    name: Create GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    needs:
      - linux
      - windows
      - sanitizer
      - windows-asan
      - cmake-minimum
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Read version
        id: version
        shell: bash
        run: |
          major="$(awk '$2 == "DOBA_VERSION_MAJOR" { print $3 }' include/version.h)"
          minor="$(awk '$2 == "DOBA_VERSION_MINOR" { print $3 }' include/version.h)"
          patch="$(awk '$2 == "DOBA_VERSION_PATCH" { print $3 }' include/version.h)"
          version="${major}.${minor}.${patch}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in include/version.h: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate existing tag
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            target="$(git rev-list -n 1 "$tag")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "$tag points to $target instead of $GITHUB_SHA" >&2
              exit 1
            fi
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          --target "$GITHUB_SHA"
          --title "doba ${{ steps.version.outputs.version }}"
          --generate-notes
