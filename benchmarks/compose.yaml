services:
  daemon:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - dind-data:/var/lib/docker

  runner:
    build:
      context: .
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    network_mode: service:daemon
    volumes:
      - runner-work:/work
      - ./artifacts:/artifacts
      - ./web-frameworks/http/v11:/adapters/web-frameworks:ro
      - ./httparena/http/v11:/adapters/httparena:ro

volumes:
  dind-data:
  runner-work:
